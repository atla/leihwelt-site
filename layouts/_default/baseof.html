<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "header.html" . -}}
  <main id="main" class="main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
  {{- block "scripts" . }}{{ end -}}
</body>
</html>
