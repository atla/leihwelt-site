<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">Leihwelt</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ "/#games" | relURL }}">Games</a>
      <a href="{{ "/about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>About</a>
      <a href="{{ "/#contact" | relURL }}">Contact</a>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle light / dark">

      <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>
