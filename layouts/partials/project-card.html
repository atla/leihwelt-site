{{- $p := . -}}
<article class="project-card" data-project-card>
  <a class="card-media" href="{{ $p.RelPermalink }}">
    {{- with $p.Params.cover -}}
    <img src="{{ . | relURL }}" alt="{{ $p.Title }} gameplay" loading="lazy" width="1600" height="1000">
    {{- else -}}
    <img src="{{ "images/covers/placeholder.svg" | relURL }}" alt="" loading="lazy" width="800" height="500">
    {{- end -}}
    {{- if eq $p.Params.status "ongoing" -}}<span class="pill">In progress</span>{{- end -}}
  </a>
  <div class="card-body">
    {{- partial "meta-line.html" $p -}}
    <h2 class="card-title"><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h2>
    <p class="card-summary">{{ $p.Params.summary }}</p>
    {{- with $p.Params.technologies -}}
    <p class="tech-line">{{ delimit . " · " }}</p>
    {{- end -}}
  </div>
</article>
