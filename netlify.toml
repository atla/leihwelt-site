# Connect this repo in the Netlify UI (GitHub → atla/leihwelt).
# Build image includes Hugo when HUGO_VERSION is set.
[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.167.0"
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
